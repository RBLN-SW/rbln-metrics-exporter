name: release

# Publish from a version tag: vX.Y.Z-rcN -> Harbor, vX.Y.Z -> docker.io by
# digest. Tags are created by cut-release / tag-release only.
# Everything else lives in the release kit: https://github.com/RBLN-SW/cloud-component-release-kit

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  issues: write # GA deletes the "backport release-X.Y.Z" label
  statuses: write # rc-validate-wait posts the rc-validation status; GA reads it

jobs:
  release:
    uses: RBLN-SW/cloud-component-release-kit/.github/workflows/release.yaml@v1
    with:
      # Image names under the registry (HARBOR_REGISTRY / DOCKERHUB_REGISTRY),
      # space separated.
      images: rbln-metrics-exporter
      # Prefix of the GitHub release title.
      release_name: RBLN Metrics Exporter
    secrets: inherit

  # Hand the rc to the obedients install scenario (.buildkite/pipeline.yml in
  # release mode) once the kit has published it, then wait for the verdict and
  # record it as the `rc-validation` commit status the kit reads before GA
  # (enforced once CLOUD_COMPONENT_RC_VALIDATION_ENFORCE is "true"). obedients
  # reports the build only as its "[Metrics Exporter] PR CI" status, so the
  # verdict is polled from there. Do not mirror it from a `status` event
  # workflow: obedients re-posts its status whenever another status lands on
  # the commit, which turns any event-driven mirror into a loop (313 round
  # trips on the DRA driver's v0.2.0-rc2).
  rc-validate:
    name: rc validation · trigger obedients
    needs: release
    if: needs.release.outputs.kind == 'rc'
    # obedients is reachable only from the in-network runner.
    runs-on: rbln-sw-k8s-general
    outputs:
      build_url: ${{ steps.trigger.outputs.build_url }}
      triggered_at: ${{ steps.trigger.outputs.triggered_at }}
    steps:
      - name: Install jq
        run: command -v jq >/dev/null || { sudo apt-get update && sudo apt-get install -y jq; }
      - name: Trigger the validation build
        id: trigger
        env:
          # Webhook trigger of the PR pipeline; the URL is the credential, so it
          # lives in a secret. obedients applies the body's commit/branch/env.
          TRIGGER_URL: ${{ secrets.OBEDIENTS_VALIDATE_TRIGGER_URL }}
          SHA: ${{ needs.release.outputs.sha }}
          BRANCH: ${{ needs.release.outputs.branch }}
        run: |
          set -euo pipefail
          if [ -z "$TRIGGER_URL" ]; then
            echo "::notice::secret OBEDIENTS_VALIDATE_TRIGGER_URL is not set; skipping rc validation, no rc-validation status will be posted for $GITHUB_REF_NAME"
            exit 0
          fi
          triggered_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          jq -n --arg sha "$SHA" --arg branch "$BRANCH" --arg tag "$GITHUB_REF_NAME" '{
            commit: $sha, branch: $branch, message: ("rc-validation " + $tag),
            env: { RELEASE_MODE: "true", EXPORTER_IMAGE_TAG: $tag }
          }' | curl -sSf -X POST -H 'Content-Type: application/json' -d @- "$TRIGGER_URL" > build.json
          url=$(jq -r '.build.web_url // .web_url // ("build #" + ((.build.number // .number) | tostring))' build.json)
          echo "rc-validation build for $GITHUB_REF_NAME: $url" | tee -a "$GITHUB_STEP_SUMMARY"
          { echo "build_url=$url"; echo "triggered_at=$triggered_at"; } >> "$GITHUB_OUTPUT"

  rc-validate-wait:
    name: rc validation · verdict -> rc-validation status
    needs: [release, rc-validate]
    if: needs.rc-validate.outputs.build_url != ''
    # GitHub API only; no obedients access needed here.
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Wait for the obedients verdict and record it
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ needs.release.outputs.sha }}
          BUILD_URL: ${{ needs.rc-validate.outputs.build_url }}
          TRIGGERED_AT: ${{ needs.rc-validate.outputs.triggered_at }}
        run: |
          set -euo pipefail
          post() {
            gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state="$1" -f context=rc-validation \
              -f description="$2" -f target_url="$BUILD_URL" >/dev/null
            echo "rc-validation=$1: $2"
          }
          post pending "obedients install scenario running on $GITHUB_REF_NAME"
          # Only a status newer than the trigger counts: a re-run must not read
          # the previous build's verdict off the same commit.
          for _ in $(seq 1 170); do
            # gh api has no --arg: the timestamp is interpolated into the jq program.
            state=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/status" \
              --jq ".statuses[] | select(.context == \"[Metrics Exporter] PR CI\" and .updated_at > \"$TRIGGERED_AT\") | .state")
            case "$state" in
              success) post success "obedients install scenario passed on $GITHUB_REF_NAME"; exit 0 ;;
              failure|error) post failure "obedients install scenario $state on $GITHUB_REF_NAME"; exit 1 ;;
            esac
            sleep 60
          done
          post error "obedients install scenario did not finish within 170 minutes"
          exit 1
