name: piper RC contract
on:
  pull_request:
    paths:
      - '.buildkite/pipeline.piper.pr.yml'
      - '.github/scripts/piper*'
      - '.github/scripts/test_piper_rc.py'
      - '.github/workflows/release.yaml'
      - '.github/workflows/piper-rc-checks.yaml'
  push:
    branches: [main]
    paths:
      - '.buildkite/pipeline.piper.pr.yml'
      - '.github/scripts/piper*'
      - '.github/scripts/test_piper_rc.py'
      - '.github/workflows/release.yaml'
      - '.github/workflows/piper-rc-checks.yaml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure system Python has PyYAML
        run: /usr/bin/python3 -c 'import yaml' 2>/dev/null || (sudo apt-get update && sudo apt-get install -y python3-yaml)
      - name: Check RC request and result handling without external calls
        run: /usr/bin/python3 -m unittest discover -s .github/scripts -p 'test_piper_rc.py' -v
