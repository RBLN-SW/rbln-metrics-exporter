name: Piper result sync

on:
  status:
  workflow_run:
    workflows: ["PR Validation"]
    types: [completed]

permissions:
  contents: read
  pull-requests: read
  actions: write

concurrency:
  group: piper-result-sync-${{ github.event.sha || github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  recheck:
    if: >-
      (github.event_name == 'status' && github.event.state == 'success' && github.event.context == '[Metrics Exporter] PR CI') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'failure')
    runs-on: rbln-sw-k8s-general
    timeout-minutes: 5
    steps:
      # The callback always runs trusted default-branch code, never the PR tree.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Recheck a failed PR workflow after its Piper build recovers
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PIPER_URL: ${{ vars.PIPER_URL || 'https://piper.k8s.rebellions.in' }}
          PIPER_TOKEN: ${{ secrets.PIPER_TOKEN }}
        run: python3 .github/scripts/pr_ci.py sync
