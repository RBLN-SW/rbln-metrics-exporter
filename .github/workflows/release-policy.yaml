name: release-policy

# Required status check for pull requests into release-* branches. The check
# context is "release-policy / release-policy": do not rename the job.
# Everything else lives in the release kit: https://github.com/RBLN-SW/cloud-component-release-kit

on:
  pull_request:
    branches: ["release-*"]
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: write # advisory size comment

concurrency:
  group: release-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  release-policy:
    uses: RBLN-SW/cloud-component-release-kit/.github/workflows/release-policy.yaml@v1
    with:
      # Pathspecs excluded from the advisory size check. Add generated
      # directories of this repository.
      generated_paths: "vendor go.sum pkg/rblnservicespb"
