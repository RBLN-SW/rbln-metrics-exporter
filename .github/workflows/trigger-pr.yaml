name: PR Validation

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write
  statuses: write
  security-events: write # image-scan.yaml uploads SARIF to code scanning

jobs:
  pr-title-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title
        uses: amannn/action-semantic-pull-request@v5
        with:
          types: |
            build
            chore
            ci
            docs
            feat
            fix
            perf
            refactor
            revert
            style
            test
          scopes: |
            .*
          requireScope: false
          subjectPattern: ^.{1,100}$
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  code-check:
    needs: pr-title-validation
    uses: ./.github/workflows/go-checks.yaml
  go-build:
    needs: pr-title-validation
    uses: ./.github/workflows/go-build.yaml
  image-scan:
    needs: [code-check, go-build]
    uses: ./.github/workflows/image-scan.yaml
    secrets: inherit
    with:
      fail-on-findings: true
